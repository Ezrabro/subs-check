# Show progress
print-progress: true

# Concurrent threads (used during liveness check)
concurrent: 50
# Media check concurrency (defaults to concurrent)
media-concurrent: 20
# Speed test concurrency (defaults to concurrent)
# Recommended to keep low to avoid bandwidth competition causing inaccurate results
speed-concurrent: 20
# Randomize test order (only affects test sequence, output keeps original subscription order)
# Prevents same-provider adjacent nodes and same-node multi-protocol from clustering in the same time window
# Reduces probability of neighboring IPs failing together or interfering
shuffle-test-order: true
# Check interval (minutes)
# Must be >0; <=0 sets to 1 minute
check-interval: 120
# Cron expression: if set, ignores check-interval
# Supports standard cron expressions, e.g.:
# "0 */2 * * *" runs at every 2-hour mark
# "0 0 */2 * *" runs at 00:00 every 2 days
# "0 0 1 * *" runs at 00:00 on 1st of each month
# "*/30 * * * *" runs every 30 minutes
# cron-expression: "*/30 * * * *"

# Save how many successful nodes; 0 means unlimited 
# If concurrency exceeds this, results may exceed this number
# success-limit <= success <= success-limit+concurrent
success-limit: 0

# Timeout in ms (max node delay)
timeout: 5000
# Alive-test URL
# Advanced: replace URL with https://www.cloudflare.com
alive-test-url: http://gstatic.com/generate_204
# Speed test URL (note: concurrency * node speed < max bandwidth)
# Avoid using Speedtest; many nodes block it
# If no stable URL, self-host
speed-test-url: https://github.com/AaronFeng753/Waifu2x-Extension-GUI/releases/download/v2.21.12/Waifu2x-Extension-GUI-v2.21.12-Portable.7z
# Minimum speed result discard (KB/s)
min-speed: 512
# Download test time in seconds (depends on file size; max 10s by default)
download-timeout: 10
# 单nodeSpeed test下载数据大小(MB)限制，0为不限
download-mb: 20
# 总下载速度速度限制(MB/s)，0为不限
total-speed-limit: 0

# 监听端口，用于直接返回nodeinfo，方便订阅转换
# http://127.0.0.1:8199/all.yaml
# 注意：为方便小白默认监听0.0.0.0:8199，请自行修改
# 更新需restart程序
listen-port: ":8199"

# 以nodeIP查询位置重命名node
# 质量差的node可能造成IP查询失败，造成整体检查速度稍微变慢，默认true
rename-node: true
# node前缀，依赖rename-node为true才生效
node-prefix: ""

# 只测试指定协议的node
node-type:
  # - ss
  # - vmess
  # - vless

# node名称过滤，只有匹配任一正则表达式的node才会被保留
# 如果empty则不过滤，所有through测试的node都会保留
# 注意：过滤在流媒体check+重命名之后、Speed test之前进行。此时node名称已包含
#       国家和媒体标签（如 NF-US、GPT⁺、IP 风险百分比），但**不包含速度标签**。
#       速度标签在Speed testthrough后追加，不参与过滤。
filter:
  # === 按地区过滤 ===
  # - "香港|HK|Hong Kong"        # 保留香港node
  # - "新加坡|SG|Singapore"      # 保留新加坡node
  # - "台湾|TW|Taiwan"           # 保留台湾node
  #
  # === 按 IP 风险过滤（需开启 media-check 和 iprisk）===
  # - "\\|[0-4]?[0-9]%"          # 保留 IP 风险 < 50% 的node
  # - "\\|[0-9]%\\|"             # 保留 IP 风险 < 10% 的node（个位数）
  #
  # === 按平台解锁过滤（需开启 media-check）===
  # - "GPT⁺|GPT"                 # 保留解锁 OpenAI 的node
  # - "NF"                       # 保留解锁 Netflix 的node（NF=仅自制剧, NF-US=全解锁）
  # - "GM"                       # 保留解锁 Gemini 的node
  # - "D\\+"                     # 保留解锁 Disney+ 的node（D+=解锁但未知地区, D+-US=解锁并知道地区）
  # - "YT-"                      # 保留解锁 YouTube Premium 的node
  # - "CL-"                      # 保留解锁 Claude 的node
  # - "SP-"                      # 保留解锁 Spotify 的node

# 是否开启流媒体check，其中IP欺诈依赖重命名
media-check: false
# 流媒体check超时时间(秒)，未设置则默认为10秒
media-check-timeout: 5
platforms:
  - iprisk
  - tiktok
  - youtube
  - netflix
  - disney
  - openai
  - gemini
  - claude
  - spotify

# 保留RecentN天内可用的历史node（天）
# 开启后每次check会savenode快照到 output/history/ 目录
# 下次check时会将历史node加入待测队列重新check，through的node才会保留到输出中
# 过期的历史文件会自动清理
# 0 = close此功能
keep-days: 0

# 输出目录
# 如果empty，则为程序所在目录的config目录
output-dir: ""

# 是否启用Web控制面板
# 如果为false，则不启动Web控制界面，仅启动订阅服务相关接口
# 访问地址：http://127.0.0.1:8199/admin
enable-web-ui: true
# 填写Web控制面板的api-key，如果empty，则自动generate
# config文件empty时，支持use环境变量设置 API_KEY
api-key: ""

# check完成后执行的回调脚本路径
# 脚本将在check完成后执行，可用于自define通知或其他操作
# 例如: "/path/to/your/script.sh" 或 'C:\path\to\your\script.bat'
# Linux请在脚本开头添加对应的：#!/bin/bash、#!/bin/sh、#!/usr/bin/env bash 等，编写标准的脚本
# 注意如果usedocker，目前dockeruse的alpine，只有sh，不支持bash
callback-script: ""

# 填写搭建的apprise API server 地址
# https://notify.xxxx.us.kg/notify
apprise-api-server: ""
# 填写通知目标
# 支持100+ 个通知渠道，详细格式请参照 https://github.com/caronc/apprise
recipient-url: 
  # telegram格式：tgram://{bot_token}/{chat_id}
  # - tgram://xxxxxx/-1002149239223
  # 钉钉格式：dingtalk://{Secret}@{ApiKey}
  # - dingtalk://xxxxxx@xxxxxxx
# 自define通知标题
notify-title: "🔔 node状态更新"

# sub-store的启动端口，empty则不启动sub-store
# 更新需restart程序，不可监听局域网IP，只有三种写法 :8299, 127.0.0.1:8299, 0.0.0.0:8299
# sub-store-port: ":8299"
sub-store-port: ":8299"
# sub-store自define访问路径，必须以/开头，后续访问订阅也要带上此路径
# 设置path之后，还可以开启订阅分享功能，无需暴露真实的path
# sub-store-path: "/path"
sub-store-path: ""
# 以下config去viewsub-store相关的教程：https://hub.docker.com/r/xream/sub-store
# sub-store同步gist定时任务
# 定时任务指定时将订阅/文件上传到私有 Gist. 在前端, 叫做 同步 或 同步config.
# 55 23 * * * 每天 23 点 55 分(避开部分机场后端每天0点定时restart)
sub-store-sync-cron: ""
# 定时更新订阅
# SUB_STORE_PRODUCE_CRON 在后台定时处理订阅. 格式为 0 */2 * * *,sub,a;0 */3 * * *,col,b
# 即每 2 小时处理一次单条订阅 a, 每 3 小时处理一次组合订阅 b.
sub-store-produce-cron: ""
# sub-store推送服务地址
# 例如：Brak: "SUB_STORE_PUSH_SERVICE=https://api.day.app/XXXXXXXXXXXX/[推送标题]/[推送内容]"
# 注意：仅需修改 XXXXXXXXXXXX 为自己的 token，[推送标题]/[推送内容] 会被sub-store自动替换为对应的内容
sub-store-push-service: ""


# 覆写订阅的url，这个的作用是generate带指定规则的mihomo/clash.meta订阅链接
# 防止网络不好，所以现在内置，依赖:8199端口
# 如果你想替换其他的自define覆写文件，自己命名后放在output目录，然后更改此URL后缀即可
mihomo-overwrite-url: "http://127.0.0.1:8199/sub/ACL4SSR_Online_Full.yaml"

# save方法
# 目前支持的save方法: r2, local, gist, webdav, s3
save-method: local

# webdav
webdav-url: "https://example.com/dav/"
webdav-username: "admin"
webdav-password: "admin"

# gist id
github-gist-id: ""
# github token
github-token: ""
# github api mirror
github-api-mirror: ""

# 将Speed test结果推送到Worker的地址
worker-url: https://example.worker.dev
# Worker令牌
worker-token: 1234567890

# 将Speed test结果推送到S3/Minio的地址
s3-endpoint: "127.0.0.1:9000"
# S3的访问凭证
s3-access-id: "ak"
s3-secret-key: "sk"
# S3的Bucket名称
s3-bucket: "public"
# 是否useSSL
s3-use-ssl: false
# 默认自动判断dns还是path，但一些云厂商不遵循规范，所以有时需要手动设置
# 可选值：auto, path, dns
s3-bucket-lookup: "auto"

# 重试次数(获取订阅失败后重试次数)
sub-urls-retry: 3
# 订阅下载并发数(控制同时拉取多少个订阅链接)
sub-urls-concurrent: 20
# 获取订阅时use的UA；如果设置random将会use随机UA获取订阅
# sub-urls-get-ua: "random"
sub-urls-get-ua: "clash.meta (https://github.com/Ezrabro/subs-check)"
# Github Proxy，获取订阅use，结尾要带的 /
# github-proxy: "https://ghfast.top/"
github-proxy: ""
# 此参数更通用，适用于拉取代理、消息推送、文件上传等等
# 写法跟环境变量一样。修改需restart生效
# proxy: "http://username:password@192.168.1.1:7890"
# proxy: "socks5://username:password@192.168.1.1:7890"
proxy: ""
# 符合条件node数量的占比，低于此值会将订阅链接打印出来，用于排查质量差的订阅
success-rate: 0

# 是否允许 IPv6/AAAA 解析和连接
ipv6: true

# DNS config，支持 udp/tcp/tls/https/quic 协议
# enable=false use系统 DNS；enable=true use以下自define DNS
# enable=true 三字段可留空，按 proxy-server-nameserver→nameserver→default-nameserver 链回落
# default-nameserver 用作 bootstrap 必须是纯 IP
dns:
  enable: false
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

# 远程订阅清单地址；用于集中维护多个订阅链接，避免频繁修改本地文件
# 支持两种格式：
# 1) 纯文本：按行分隔，支持 # 注释与空行
# 2) YAML/JSON：字符串数组 ["https://...", "https://..."]
# 支持时间占位符与 github-proxy，例如包含 {Ymd}、{Y-m-d}
sub-urls-remote:
  # - https://example.com/sub-list.txt
  # - https://example.com/sub-list.yaml
  - https://raw.githubusercontent.com/Ezrabro/sub-urls/refs/heads/main/%E5%B0%8F%E8%80%8C%E7%BE%8E.txt

# 订阅地址 支持 clash/mihomo/v2ray/base64 格式的订阅链接
# 如果用户想明确useclash类型，那可以在支持的订阅链接结尾加上 &flag=clash.meta
# github 链接可自己添加ghproxyuse；订阅链接支持 HTTP_PROXY HTTPS_PROXY 环境变量加速拉取
# 如果用户想区分node来源，可在订阅链接结尾加上 #备注 ，备注字段会自动加到node命名结尾
